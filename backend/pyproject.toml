[project]
name = "nodus-sonare-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "boto3>=1.43.127",
    "email-validator>=2.3.0",
    "fastapi>=0.162.2",
    "mutagen>=1.48.1",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

# --- Quality tooling (config as code: CI and developers run exactly these settings) ---------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["unit: fast, isolated tests of business logic (no network, no disk, no containers)"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
# Only business modules are measured; adapters, routers and wiring belong to other test layers.
source = ["app/domain", "app/services"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
precision = 1

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# B008: FastAPI declares dependencies as File()/Depends() defaults by design.
ignore = ["B008"]
